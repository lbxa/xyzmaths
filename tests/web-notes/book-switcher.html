<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Switch between reading editions</title>
<iframe title="Book reader"></iframe>
<output>Waiting for the reader</output>
<script type="module">
  const frame = document.querySelector("iframe");
  const output = document.querySelector("output");
  const selector = '[role="combobox"][aria-label="Book"]';
  const algebra = { title: "Linear Algebra", slug: "linear-algebra", chapter: "linear-algebra-i/vector-spaces-and-bases/" };
  const analysis = { title: "Introduction to Mathematical Analysis", slug: "maths-analysis", chapter: "analysis-i/sets-and-foundations/" };
  const [from, to] = location.hash === "#maths-analysis" ? [algebra, analysis] : [analysis, algebra];

  try {
    const loaded = new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));
    frame.src = "/notes/" + from.slug + "/" + from.chapter;
    await loaded;
    const trigger = frame.contentDocument.querySelector(selector);
    const island = trigger.closest("astro-island");
    if (island?.hasAttribute("ssr")) {
      await new Promise(resolve => island.addEventListener("astro:hydrate", resolve, { once: true }));
    }
    trigger.click();
    await new Promise(resolve => setTimeout(resolve));
    const options = [...frame.contentDocument.querySelectorAll('[role="option"]')];
    const selected = options.find(item => item.getAttribute("aria-selected") === "true");
    if (selected?.textContent.trim() !== from.title) throw new Error("Incorrect selected title");
    const option = options.find(item => item.textContent.trim() === to.title);
    if (!option) throw new Error("Missing option for " + to.title);

    const destination = new Promise(resolve => {
      frame.addEventListener("load", () => resolve(frame.contentWindow.location), { once: true });
      frame.contentDocument.addEventListener("astro:before-preparation", event => resolve(event.to), { once: true });
    });
    option.click();
    const target = await destination;
    if (target.pathname !== "/notes/" + to.slug + "/") throw new Error("Incorrect destination " + target.pathname);
    const response = await fetch(target);
    if (!response.ok) throw new Error("Unpublished edition: " + response.status);
    const book = new DOMParser().parseFromString(await response.text(), "text/html");
    if (book.querySelector(selector)?.textContent.trim() !== to.title) throw new Error("Incorrect edition at destination");
    output.textContent = "Selected " + to.title;
  } catch (error) {
    output.textContent = error.message;
  }
</script>
</html>
